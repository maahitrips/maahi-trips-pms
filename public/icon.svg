<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#pmsGrad)" />

  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Hotel Building & Crown Emblem -->
  <g filter="url(#shadow)">
    <!-- Central Building Structure -->
    <path d="M 176 190 L 256 128 L 336 190 L 336 384 L 176 384 Z" fill="#ffffff" />
    
    <!-- Roof Dome Accent -->
    <path d="M 232 146 Q 256 100 280 146 Z" fill="url(#goldGrad)" />
    <circle cx="256" cy="94" r="10" fill="url(#goldGrad)" />

    <!-- Left Wing -->
    <path d="M 120 240 L 176 240 L 176 384 L 120 384 Z" fill="#f1f5f9" />
    <path d="M 116 240 L 148 214 L 180 240 Z" fill="#cbd5e1" />

    <!-- Right Wing -->
    <path d="M 336 240 L 392 240 L 392 384 L 336 384 Z" fill="#f1f5f9" />
    <path d="M 332 240 L 364 214 L 396 240 Z" fill="#cbd5e1" />

    <!-- Hotel Entrance Doorway (Grand Arch) -->
    <path d="M 228 384 L 228 300 Q 256 270 284 300 L 284 384 Z" fill="#0f766e" />
    
    <!-- Keyhole Icon inside Arch -->
    <circle cx="256" cy="326" r="10" fill="url(#goldGrad)" />
    <polygon points="252,332 260,332 263,354 249,354" fill="url(#goldGrad)" />

    <!-- Window Grids Left -->
    <rect x="136" y="260" width="22" height="26" rx="4" fill="#0f766e" />
    <rect x="136" y="304" width="22" height="26" rx="4" fill="#0f766e" />
    <rect x="136" y="348" width="22" height="26" rx="4" fill="#0f766e" />

    <!-- Window Grids Center -->
    <rect x="200" y="210" width="24" height="30" rx="5" fill="#0f766e" />
    <rect x="244" y="210" width="24" height="30" rx="5" fill="#0f766e" />
    <rect x="288" y="210" width="24" height="30" rx="5" fill="#0f766e" />
    
    <rect x="200" y="254" width="24" height="30" rx="5" fill="#0f766e" />
    <rect x="288" y="254" width="24" height="30" rx="5" fill="#0f766e" />

    <!-- Window Grids Right -->
    <rect x="354" y="260" width="22" height="26" rx="4" fill="#0f766e" />
    <rect x="354" y="304" width="22" height="26" rx="4" fill="#0f766e" />
    <rect x="354" y="348" width="22" height="26" rx="4" fill="#0f766e" />

    <!-- 5 Luxury Stars under roof -->
    <g fill="url(#goldGrad)">
      <polygon points="256,160 259,168 268,168 261,173 263,181 256,176 249,181 251,173 244,168 253,168" />
    </g>
  </g>

  <!-- Title Bottom Bar: MAAHI PMS -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">MAAHI TRIPS</text>
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="url(#goldGrad)" letter-spacing="6" text-anchor="middle">HOTEL PMS</text>
</svg>
